<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenverse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Screenverse</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">Filmes</a></li>
                <li><a href="#">Séries</a></li>
                <li><a href="#">Animes</a></li>
                <li><a href="#">Contato</a></li>
                <li><a href="#">Sugestôes</a></li>
            </ul>
        </nav>    
    </header>
    <main>
        <section class="hero">
            <section class="news">
                <h2>Últimas notícias</h2>

                <div class="card">
                    <img src="https://via.placeholder.com/300" alt="Imagem">
                    <h3>Novo filme anunciado</h3>
                    <p>Confira tudo sobre o lançamento...</p>
                </div>

                <div class="card">
                    <img src="https://via.placeholder.com/300" alt="Imagem">
                    <h3>Série em alta</h3>
                    <p>A nova série está bombando...</p>
                </div>
            </section>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Screenverse. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
