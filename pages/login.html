<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenverse - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1 class="title"><a href="../index.html">Screenverse</a></h1>
    </header>
    <main>
        <div class="auth-wrapper">
            <div class="auth-box">
                <h2>Login</h2>
                <form id="loginform">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="user-email" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Senha</label>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
                <h3>Ainda não é cadastrado? <a href="cadastro.html">Cadastre-se aqui</a></h3>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Screenverse. Todos os direitos reservados.</p>
    </footer>
    <script src="../js/script.js"></script>
</body>
</html>
