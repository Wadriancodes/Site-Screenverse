<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenverse - Sugestões</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1 class="title"><a href="../index.html">Screenverse</a></h1>
        <nav>
            <ul class="nav-links">
                <li><a href="../index.html">Início</a></li>
                <li><a href="filmes.html">Filmes</a></li>
                <li><a href="series.html">Séries</a></li>
                <li><a href="animes.html">Animes</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="sugestoes.html" class="active">Sugestões</a></li>
            </ul>
            <a href="login.html" class="nav-login">Login</a>
        </nav>    
    </header>
    <main>
        <section class="content-page">
            <h2>Sugestões</h2>
            <p class="page-description">Sugira filmes, séries ou animes que você gostaria de ver aqui</p>
            <div class="suggestion-form">
                <form>
                    <div class="form-group">
                        <label for="suggestion-type">Tipo</label>
                        <select id="suggestion-type" name="type">
                            <option value="filme">Filme</option>
                            <option value="serie">Série</option>
                            <option value="anime">Anime</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="suggestion-title">Título</label>
                        <input type="text" id="suggestion-title" name="title" placeholder="Nome do conteúdo" required>
                    </div>
                    <div class="form-group">
                        <label for="suggestion-message">Descrição (opcional)</label>
                        <textarea id="suggestion-message" name="message" rows="4" placeholder="Conte mais detalhes..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar Sugestão</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Screenverse. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
