    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1 class="title"><a href="../index.html">Screenverse</a></h1>
        <nav>
            <ul class="nav-links">
                <li><a href="../index.html">Início</a></li>
                <li><a href="filmes.html">Filmes</a></li>
                <li><a href="series.html">Séries</a></li>

            </ul>
            <a href="login.html" class="nav-login">Login</a>
        </nav>    
    </header>
    <main>
        <section class="content-page">
            <h2>Contato</h2>
            <p class="page-description">Entre em contato conosco</p>
            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="contact-name">Nome</label>
                        <input type="text" id="contact-name" name="name" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-message">Mensagem</label>
                        <textarea id="contact-message" name="message" rows="5" placeholder="Sua mensagem..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Screenverse. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
